name: Dependency audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          fail-on-severity: high
          fail-on-scopes: "runtime, development, unknown"
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-patched-versions: true

  pip-audit:
    name: Audit locked Python dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.13"

      - name: Install isolated audit toolchain
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r .github/audit/requirements.txt
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip check

      - name: Audit locked PDF dependencies with PyPI
        run: >-
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip_audit
          --strict
          --progress-spinner off
          --timeout 30
          --vulnerability-service pypi
          --aliases on
          --require-hashes
          --disable-pip
          -r requirements.txt

      - name: Audit the locked scanner toolchain with PyPI
        run: >-
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip_audit
          --strict
          --progress-spinner off
          --timeout 30
          --vulnerability-service pypi
          --aliases on
          --require-hashes
          --disable-pip
          -r .github/audit/requirements.txt
