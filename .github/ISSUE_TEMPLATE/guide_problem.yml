name: Guide, build, or accessibility problem
description: Report a non-sensitive accuracy, usability, build, or accessibility defect.
title: "[Problem]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the guide. Do not include credentials, logs, diagnostics, registry exports, unredacted screenshots, machine identifiers, account information, or other sensitive evidence. For security-sensitive matters, follow SECURITY.md and use private vulnerability reporting when available.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and reviewed the latest repository version.
          required: true
        - label: This report and its attachments contain no personal, system-identifying, confidential, or security-sensitive information.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Guide accuracy or safety
        - PDF readability or layout
        - Accessibility
        - Build or validation
        - Citation or reference
        - Repository documentation
        - Other non-sensitive issue
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Identify the release, commit, PDF edition, or page when possible.
      placeholder: "v1.0.0, commit hash, or page/section"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect, unsafe, inaccessible, or not reproducible using sanitized information only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result or proposed correction
      description: Describe the expected behavior or wording and include primary-source links when relevant.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Sanitized validation details
      description: Optional. Include only the minimum synthetic or non-identifying reproduction information needed.
    validations:
      required: false
